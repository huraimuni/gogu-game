<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>고구마게임 운영자</title>
<link rel="icon" href="icons/appicon_512.png">
<style>
:root{color-scheme:dark;--bg:#0e1426;--card:#18213a;--line:#2b3758;--fg:#eef2fb;--muted:#93a0bf;--gold:#ffd25a;--blue:#4a8cff;--red:#ff6b6b;--green:#4ccf86}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;padding:16px max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:700;font-size:13px;color:var(--muted);margin:10px 0 4px}
textarea,input,select{width:100%;background:#0e1426;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,monospace}
button{border:0;border-radius:10px;padding:11px 16px;font:700 15px inherit;cursor:pointer;background:var(--blue);color:#fff}
button.ghost{background:#2b3758}button.kakao{background:#fee500;color:#191600;width:100%}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}
.muted{color:var(--muted);font-size:13px}.ok{color:var(--green)}.bad{color:var(--red)}
.list div{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <h1>고구마게임 운영자 · 선물 지급</h1>
  <div id="msg" class="card muted">불러오는 중…</div>
  <div id="app" hidden>
    <div class="card">
      <label for="codes">받는 사람 코드 (여러 명은 줄을 바꿔 붙여 넣기)</label>
      <textarea id="codes" placeholder="GOGU-ABCD-2345"></textarea>
      <div class="row"><button class="ghost" id="check" type="button">대상 확인</button></div>
      <div id="who" class="list" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <label for="kind">선물 종류</label>
      <select id="kind"><option value="item">아이템</option><option value="points">포인트</option><option value="coupon">화력 최대 쿠폰</option></select>
      <div id="itemBox"><label for="item">아이템</label><select id="item"></select></div>
      <div id="amtBox" hidden><label for="amt">수량</label><input id="amt" type="number" min="1" max="100000" value="10" inputmode="numeric"></div>
      <label for="note">메모 (받는 사람에게 보임)</label>
      <input id="note" maxlength="100" placeholder="예: 시즌 1 우승 보상">
      <label for="days">받을 수 있는 기간(일, 비우면 무기한)</label>
      <input id="days" type="number" min="1" max="365" value="30" inputmode="numeric">
      <div class="row"><button id="give" type="button">지급하기</button></div>
      <div id="res" style="margin-top:10px"></div>
    </div>
    <p class="muted"><a href="./">← 게임으로 돌아가기</a></p>
  </div>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var cfg=window.GOGU_CONFIG||{};
  var msg=$("msg");
  function say(t,cls){msg.className="card "+(cls||"muted");msg.textContent=t;msg.hidden=false}
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){say("서버가 아직 연결되지 않았어요. config.js를 확인하세요.","bad");return}
  var sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{storageKey:"gogu-auth",persistSession:true,detectSessionInUrl:true,flowType:"pkce"}});
  function rpc(n,a){return sb.rpc(n,a||{}).then(function(r){if(r.error)throw r.error;return r.data})}
  function parse(){return $("codes").value.split(/[\s,]+/).map(function(x){return x.trim().toUpperCase()}).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i})}
  var TIER={free:"무료",paid:"유료",event:"이벤트"},SLOT={potato:"고구마",brazier:"화로",fire:"불"};
  function showLogin(){
    msg.className="card";msg.innerHTML="";
    var t=document.createElement("div");t.textContent="운영자 계정으로 로그인하세요.";msg.appendChild(t);
    var b=document.createElement("button");b.className="kakao";b.type="button";b.textContent="카카오로 로그인";b.style.marginTop="10px";
    b.addEventListener("click",function(){sb.auth.signInWithOAuth({provider:"kakao",options:{redirectTo:location.origin+location.pathname,scopes:"profile_nickname"}})});
    msg.appendChild(b);
  }
  function init(session){
    if(!session){showLogin();return}
    rpc("gogu_load").then(function(d){
      if(!d.profile.is_admin){say("운영자 권한이 없는 계정이에요. (내 코드: "+d.profile.code+")","bad");return}
      msg.hidden=true;$("app").hidden=false;
      return rpc("gogu_items_list").then(function(items){
        var sel=$("item");sel.innerHTML="";
        items.forEach(function(i){
          var o=document.createElement("option");o.value=i.id;
          var tag=i.kind==="skin"?" ["+(TIER[i.tier]||"")+" "+(SLOT[i.slot]||"")+"]":"";
          o.textContent=i.name+tag;sel.appendChild(o);
        });
      });
    }).catch(function(e){say("불러오지 못했어요: "+(e.message||e),"bad")});
  }
  $("kind").addEventListener("change",function(){var k=$("kind").value;$("itemBox").hidden=k!=="item";$("amtBox").hidden=k==="item"});
  $("check").addEventListener("click",function(){
    var codes=parse().slice(0,50),w=$("who");w.innerHTML="";
    if(!codes.length){w.textContent="코드를 입력하세요";return}
    codes.forEach(function(c){
      var r=document.createElement("div"),a=document.createElement("span"),b=document.createElement("span");
      a.textContent=c;b.textContent="확인 중…";r.appendChild(a);r.appendChild(b);w.appendChild(r);
      rpc("gogu_admin_lookup",{p_code:c}).then(function(n){b.textContent=n?n:"없는 코드";b.className=n?"ok":"bad"}).catch(function(){b.textContent="오류";b.className="bad"});
    });
  });
  var sending=false;
  $("give").addEventListener("click",function(){
    if(sending)return;
    var codes=parse(),kind=$("kind").value;
    if(!codes.length){$("res").textContent="코드를 입력하세요";return}
    var amt=parseInt($("amt").value,10),days=$("days").value?parseInt($("days").value,10):null;
    var label=kind==="item"?$("item").selectedOptions[0].textContent:kind==="points"?"포인트 "+amt:"쿠폰 "+amt+"장";
    if(!confirm(codes.length+"명에게 지급할까요?\n\n"+label))return;
    sending=true;$("give").disabled=true;
    rpc("gogu_admin_give",{p_codes:codes,p_kind:kind,p_item:kind==="item"?$("item").value:null,p_amount:kind==="item"?null:amt,p_note:$("note").value,p_days:days})
      .then(function(r){
        var t=r.given+"명에게 지급했어요.";if(r.missing&&r.missing.length)t+=" 없는 코드: "+r.missing.join(", ");
        var d=$("res");d.className=r.missing&&r.missing.length?"bad":"ok";d.textContent=t;
      }).catch(function(e){var d=$("res");d.className="bad";d.textContent="실패: "+(e.message||e)})
      .then(function(){sending=false;$("give").disabled=false});
  });
  sb.auth.getSession().then(function(r){init(r.data&&r.data.session)});
})();
</script>
</body>
</html>
