<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="icons/appicon_512.png">
<link rel="apple-touch-icon" href="icons/appicon_512.png">
<meta name="theme-color" content="#0e1426">
<title>고구마 굽기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one full-height night scene, like a street at closing time. Totals on top, the pixel terminal in the middle as the tap target, round shortcut buttons on the right, coupon and level bar along the bottom. Shop and missions open as bottom sheets. A single dark look by choice. */
:root{
  color-scheme:dark;
  --night1:#080c16; --night2:#141c30; --snow:#cfd8e6; --lamp:#ffb45e;
  --fg:#f4f7fc; --muted:#9aa8bf; --gold:#ffcf4a; --gold2:#f0a21c; --red:#e5483d; --green:#34c77b;
  --fa:255,130,40; --fb:255,90,20; --fe:255,179,71;
  --sheet:#ffffff; --sheet-fg:#161d2b; --sheet-muted:#6b7688; --row:#f2f5f9; --line:#e0e6ee; --blue:#2f6df6;
  --f-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif; --f-body:"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none;overflow-x:hidden;max-width:100%}
.app,.stage{overflow-x:clip}
body{margin:0;background:var(--night1);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden}
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,var(--night1) 0%,var(--night2) 62%,#222c44 100%)}
.scene .glow{position:absolute;right:-8%;top:8%;width:62vmax;height:62vmax;max-width:520px;max-height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--fe),.34) 0%,rgba(var(--fe),.12) 38%,rgba(var(--fe),0) 68%)}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:18%;
  background:linear-gradient(180deg,#9aa6bb 0%,#c3cddd 100%);opacity:.9}
.app{box-sizing:border-box;position:relative;z-index:1;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  padding-block:8px calc(14px + env(safe-area-inset-bottom,0px))}
.strip{margin:0 -16px;padding:6px 16px;font-size:12px;line-height:1.45;text-align:center;
  background:linear-gradient(90deg,#2a4fd6,#7a3ad1,#d23a5c);color:#fff}
.strip a{color:#fff;font-weight:700;text-decoration:underline}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.title{text-align:center;flex:1;min-width:0;overflow:hidden;white-space:nowrap;line-height:1.1}
.title b{display:block;font:400 clamp(24px,8vw,32px) var(--f-display);letter-spacing:.02em;background:linear-gradient(180deg,#fff4c0 10%,#ffb347 55%,#ff6a2a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(90,30,0,.7)) drop-shadow(0 3px 8px rgba(255,120,30,.45))}
.title small{display:block;margin-top:3px;font:700 10px var(--f-body);color:var(--muted);letter-spacing:.04em}
.sq{width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--fg);font:700 11px var(--f-body);cursor:pointer;padding:0}
.sq .b{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font:400 16px var(--f-display);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);position:relative}
.sq .b i{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/18px var(--f-body);font-style:normal;text-align:center;padding:0 4px}
.sq:focus-visible,.cp:focus-visible,.term:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pills{display:flex;justify-content:center;gap:6px;margin-top:6px}
.pill{background:#fff;color:var(--sheet-fg);border-radius:999px;padding:4px 11px;font:700 12px var(--f-body);font-variant-numeric:tabular-nums}
.total{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.total img{width:30px;height:30px;image-rendering:pixelated;flex:none}
.total .big{font:400 clamp(20px,6.5vw,28px) var(--f-display);font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.5);min-width:0;overflow-wrap:anywhere}
.rates{text-align:center;margin-top:3px;font:700 12px var(--f-body);font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.rates div b{font-weight:700}
.rates .s b{color:#ffd9a8}.rates .c b{color:#bfe9cf}
.rates .x{color:var(--gold);margin-left:6px}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:340px}
.term{position:relative;display:grid;border:0;background:none;padding:0;cursor:pointer;touch-action:none;z-index:2;transition:transform .06s}
.term img{grid-area:1/1;display:block;width:min(400px,96vw);aspect-ratio:1;image-rendering:pixelated;filter:drop-shadow(0 16px 14px rgba(0,0,0,.45));pointer-events:none}
.term:active,.term.hit{transform:scale(.96)}
.term .f1{animation:fa .5s steps(1) infinite}
.term .f2{animation:fb .5s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}

.heat{position:absolute;left:50%;top:50%;width:min(400px,96vw);aspect-ratio:1;transform:translate(-50%,-50%);z-index:1;pointer-events:none}
.heat::before{content:"";position:absolute;left:8%;right:8%;bottom:-4%;height:46%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 70%,rgba(var(--fa),.55) 0%,rgba(var(--fb),.22) 45%,rgba(var(--fb),0) 72%);opacity:.35;transition:opacity .4s}
.heat .sm{position:absolute;left:var(--x);top:36%;width:34%;aspect-ratio:1;border-radius:50%;opacity:0;filter:blur(7px);
  background:radial-gradient(circle,rgba(210,214,224,.55) 0%,rgba(210,214,224,.22) 50%,rgba(210,214,224,0) 72%);
  animation:smk var(--t) ease-out var(--d) infinite}
.heat .em{position:absolute;left:var(--x);bottom:16%;width:5px;height:5px;background:rgb(var(--fe));box-shadow:0 0 6px 1px rgba(var(--fa),.9);opacity:0;
  animation:emb var(--t) ease-out var(--d) infinite}
.heat .more{display:none}
@keyframes smk{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.5}100%{transform:translate(var(--sx),-150%) scale(1.7);opacity:0}}
@keyframes emb{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--sx),-260%);opacity:0}}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}
body.boost .heat::before{opacity:1;animation:pulse .35s ease-in-out infinite}
body.boost .heat .more{display:block}
body.boost .heat .sm{animation-duration:calc(var(--t)*.55);filter:blur(6px);
  background:radial-gradient(circle,rgba(235,238,246,.8) 0%,rgba(225,228,238,.38) 50%,rgba(225,228,238,0) 72%)}
body.boost .heat .em{animation-duration:calc(var(--t)*.7)}
body.boost .scene .glow{filter:brightness(1.9) saturate(1.2)}
.scene .glow{transition:filter .4s}
body.boost .term img{filter:drop-shadow(0 16px 14px rgba(0,0,0,.45)) drop-shadow(0 0 16px rgba(var(--fa),.75)) brightness(1.12)}
body.fire-rainbow .heat,body.fire-rainbow .scene .glow{animation:rbw 3s linear infinite}
@keyframes rbw{to{filter:hue-rotate(360deg)}}
body.boost .term .f1{animation-duration:.2s}
body.boost .term .f2{animation-duration:.2s}
.fx{position:absolute;pointer-events:none;font:400 22px var(--f-display);color:var(--gold);text-shadow:0 2px 4px rgba(0,0,0,.7);z-index:5;animation:rise .8s ease-out forwards;white-space:nowrap}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.bill{position:absolute;width:30px;height:18px;image-rendering:pixelated;pointer-events:none;z-index:4;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.7);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1);opacity:0}}
.side{position:absolute;right:0;bottom:14px;display:flex;flex-direction:column;gap:12px;z-index:3}
.bottom{display:flex;align-items:center;gap:12px}
.cp{position:relative;width:72px;height:72px;flex:none;border-radius:20px;border:3px solid #fff2c4;cursor:pointer;color:#5a3a00;
  background:linear-gradient(160deg,#ffe58a,var(--gold2));font:400 17px var(--f-display);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.cp:disabled{filter:grayscale(.6);opacity:.7;cursor:default}
.cp{flex-direction:column;gap:1px;font-size:15px}
.cp img{width:30px;height:30px;image-rendering:pixelated;display:block}
.cp span{font-size:13px;white-space:nowrap;letter-spacing:-.5px}
.cp em{font:700 11px/1 var(--f-body);font-style:normal;color:#5a3a00;display:block;min-height:11px}
.cp i{position:absolute;right:-8px;top:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;border:2px solid var(--night2);
  font:700 12px/20px var(--f-body);font-style:normal;text-align:center;padding:0 5px}
.lv{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 14px 6px 6px;color:var(--sheet-fg)}
.dia{width:34px;height:34px;flex:none;border-radius:50%;background:linear-gradient(135deg,#6aa6ff,#a56bff);color:#fff;font:400 15px/34px var(--f-display);text-align:center}
.lv .bar{flex:1;height:14px;border-radius:7px;background:#e6ebf2;overflow:hidden;position:relative}
.lv{border:0;font:inherit;cursor:pointer;text-align:left}.lv:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.lv.can{animation:pulse .8s ease-in-out infinite}
.lv .bar>div{height:100%;width:0;background:linear-gradient(90deg,#4ccf86,#4aa3ff,#a56bff);transition:width .2s}
.lv .bar span{position:absolute;inset:0;text-align:center;font:700 10px/14px var(--f-body);color:#173}
.splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--night1) 0%,var(--night2) 70%,#222c44 100%);
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  transition:opacity .35s}
.splash.off{opacity:0;pointer-events:none}
.sp-in{max-width:440px;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.4vh,24px);text-align:center}
.sp-art{display:grid;width:min(300px,72vw,28vh)}
.sp-art img{grid-area:1/1;width:100%;aspect-ratio:1;image-rendering:pixelated;filter:drop-shadow(0 12px 12px rgba(0,0,0,.45))}
.sp-art .f1{animation:fa .5s steps(1) infinite}
.sp-art .f2{animation:fb .5s steps(1) infinite}

.sp-art{position:relative}
.sp-art .sp-lit{grid-area:1/1;display:grid;animation:ignite 2s ease-out forwards}
.sp-glow{position:absolute;left:50%;top:58%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,150,40,.55) 0%,rgba(255,110,20,.18) 45%,rgba(255,110,20,0) 70%);opacity:0;animation:glowin 2s ease-out forwards;pointer-events:none}
.sp-art .sk,.sp-art .st{position:absolute;pointer-events:none;opacity:0}
.sp-art .sk{width:4px;height:4px;background:#ffb43a;box-shadow:0 0 4px #ff7a1a;bottom:30%;animation:spark .7s ease-out forwards}
.sp-art .st{width:14px;height:14px;background:rgba(255,255,255,.55);bottom:62%;animation:steam 1.1s ease-out infinite}
@keyframes ignite{0%{filter:brightness(.16) saturate(.15)}30%{filter:brightness(.28) saturate(.4)}60%{filter:brightness(.7) saturate(.85)}85%,100%{filter:brightness(1) saturate(1)}}
@keyframes glowin{0%,25%{opacity:0}70%,100%{opacity:1}}
@keyframes spark{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-70px)}}
@keyframes steam{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:.7}100%{opacity:0;transform:translate(var(--dx),-60px) scale(1.7)}}
.sp-tag{font:700 14px var(--f-body);letter-spacing:.08em;color:var(--muted);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px 12px}
.sp-in h2{margin:0;font:400 clamp(44px,min(17vw,8vh),72px)/1.1 var(--f-display);letter-spacing:.02em;word-break:keep-all;background:linear-gradient(180deg,#fff4c0 10%,#ffb347 55%,#ff6a2a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(90,30,0,.75)) drop-shadow(0 4px 14px rgba(255,120,30,.5))}
.sp-msg{margin:0;font:500 clamp(13px,min(4.2vw,2.3vh),18px)/1.6 var(--f-body);word-break:keep-all;color:var(--fg)}
.sp-sub{margin:0;font:400 clamp(12px,min(3.6vw,1.9vh),15px)/1.5 var(--f-body);color:var(--muted);word-break:keep-all}
.sp-bar{width:100%;height:10px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
.sp-bar>div{height:100%;width:0;background:linear-gradient(90deg,#ff8a1c,#ffd23d);animation:spload 2s linear forwards}
@keyframes spload{to{width:100%}}
.sp-load{margin:0;font:700 14px var(--f-body);color:var(--muted)}
.sp-go{border:0;border-radius:14px;padding:clamp(11px,2vh,16px) 44px;font:400 clamp(18px,2.8vh,22px) var(--f-display);color:#4a2c00;cursor:pointer;
  background:linear-gradient(160deg,#ffe58a,var(--gold2));border:2px solid #fff2c4}
.sp-go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.scrim{position:fixed;inset:0;background:rgba(5,8,16,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;height:calc(100% - 12px);height:calc(100dvh - 12px);z-index:31;background:var(--sheet);color:var(--sheet-fg);
  border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;
  padding:12px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.sheet.on{transform:translateY(0)}
.grip{width:44px;height:5px;border-radius:3px;background:#cfd6e1;margin:0 auto 10px;flex:none}
.stab{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex:none}
.stab button{white-space:nowrap;border:0;background:none;font:700 15px var(--f-body);color:var(--sheet-muted);padding:8px 4px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.shoptabs{display:flex;gap:6px;margin-bottom:10px}.shoptabs button{flex:1;border:0;border-radius:12px;padding:10px 4px;font:700 14px var(--f-body);background:var(--row);color:var(--sheet-muted);cursor:pointer}.shoptabs button[aria-pressed="true"]{background:var(--sheet-fg);color:#fff}
.stab button[data-t]{display:none}
.stitle{font:700 17px var(--f-body);padding:6px 4px 10px;align-self:center}
.stab button[aria-selected="true"]{color:var(--sheet-fg);border-bottom-color:var(--sheet-fg)}
.stab .x{position:sticky;right:0;background:var(--sheet);margin-left:auto;font-size:20px;color:var(--sheet-muted)}
.hud{flex:none;margin:12px 0 8px;border:3px solid transparent;border-radius:16px;padding:9px 14px;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#ff5d7a,#ffb347,#ffe36e) border-box}
.hud .m{font:400 22px var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hud .r{font:700 13px var(--f-body);color:var(--sheet-muted);font-variant-numeric:tabular-nums}
.hud .r .s{color:#b0651a}.hud .r .c{color:#2f8a5c}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 0 24px;overscroll-behavior:contain}
.teaser{margin:4px 2px 10px;padding:10px 12px;border-radius:12px;background:var(--row);color:var(--sheet-muted);font:700 13px var(--f-body);text-align:center}
.group{font:700 12px var(--f-body);color:var(--sheet-muted);letter-spacing:.06em;margin:8px 2px 0}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--row);border:2px solid transparent;border-radius:18px;padding:10px 12px;cursor:pointer}
.item.can{background:#fff;border-color:var(--blue)}
.item.off{opacity:.62}
.ico{width:52px;height:52px;border-radius:14px;background:#dfe6f2;display:flex;align-items:center;justify-content:center;font:400 15px var(--f-display);color:var(--blue);position:relative}
.item.s .ico{color:#b0651a;background:#f6e7d3}
.ico img{width:40px;height:40px;image-rendering:pixelated;display:block}
.ico em{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font:700 10px var(--f-body);font-style:normal;background:#e8456b;color:#fff;border-radius:9px;padding:1px 7px;white-space:nowrap}
.nm{font:700 15px var(--f-body)}
.ef{font:700 13px var(--f-body);color:#2f8a5c;font-variant-numeric:tabular-nums}
.item.s .ef{color:#b0651a}
.cost{font:400 15px var(--f-display);font-variant-numeric:tabular-nums;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;text-align:right;max-width:150px}
.item.can .cost{background:var(--blue);color:#fff;border-color:var(--blue)}
.mis{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--row);border-radius:18px;padding:12px 14px}
.mis.done{opacity:.55}
.mis .bar{height:8px;border-radius:4px;background:#dde3ee;margin-top:8px;overflow:hidden}
.mis .bar>div{height:100%;width:0;background:var(--green)}
.btn{border:0;border-radius:12px;background:var(--blue);color:#fff;font:700 14px var(--f-body);padding:10px 14px;cursor:pointer;white-space:nowrap}
.btn:disabled{background:#c5cdda;cursor:default}
.btn.ghost{background:#e6ebf3;color:var(--sheet-fg)}

.seg{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;color:var(--sheet-fg);border-radius:999px;padding:6px 12px;font:700 13px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sheet-fg);color:#fff;border-color:var(--sheet-fg)}
.rk{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:var(--row);border-radius:14px;padding:9px 12px;margin-bottom:6px;font:600 14px var(--f-body)}
.rk.me{outline:2px solid var(--blue);background:#fff}
.rk .n{color:var(--sheet-muted);font-variant-numeric:tabular-nums}.rk .v{font-variant-numeric:tabular-nums;color:#b0651a;font-weight:700}
.rk small{color:var(--sheet-muted);font-weight:500;margin-left:4px}
.card{background:var(--row);border-radius:16px;padding:12px 14px;margin-bottom:10px;font:500 14px/1.5 var(--f-body)}
.card h4{margin:0 0 6px;font:700 14px var(--f-body);color:var(--sheet-muted)}
.card .big{font:700 18px var(--f-body)}
.card .row{display:flex;gap:8px;align-items:center;margin-top:8px}
.card input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:500 15px var(--f-body);background:#fff;color:var(--sheet-fg)}
.card .btn,.cbtn{border:0;border-radius:10px;padding:9px 14px;font:700 14px var(--f-body);background:var(--blue);color:#fff;cursor:pointer}
.cbtn.ghost{background:#e3e8f1;color:var(--sheet-fg)}
.kakao{width:100%;border:0;border-radius:12px;padding:13px;font:700 16px var(--f-body);background:#fee500;color:#191600;cursor:pointer}
.muted{color:var(--sheet-muted);font-size:13px}
.codebox{font:700 18px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em}
.menu{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--row);border-radius:16px;padding:16px;margin-bottom:10px;font:700 16px var(--f-body);color:var(--sheet-fg);cursor:pointer;text-align:left}
.menu small{display:block;font:500 13px var(--f-body);color:var(--sheet-muted);margin-top:2px}
.menu i{font-style:normal;color:var(--sheet-muted);font-size:20px}
.back{margin-bottom:10px;position:sticky;top:6px;z-index:8;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.item:focus-visible,.btn:focus-visible,.stab button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  function offlinePopup(g,secs){
    var o=el("div"),capped=secs>=offCap()-1;
    popup({first:true,title:"자리를 비운 동안",lines:[dur(secs)+" 동안"+(capped?" (최대 "+PERK.offlineH+"시간)":"")],value:"+"+fmt(g)+"원",msg:"고구마가 알아서 구워졌어요!",btn:"받았어요"});
  }
  // 팝업은 하나씩 차례로 띄운다 (시작 화면이 떠 있는 동안은 기다림)
  var popQ=[],popOn=false;
  function popup(o){if(o.first)popQ.unshift(o);else popQ.push(o);popFlush()}
  function popFlush(){
    if(popOn||!popQ.length||$("splash"))return;
    popOn=true;var o=popQ.shift();
    var w=el("div","pop"),b=el("div","box");w.setAttribute("role","dialog");
    var pi=el("img","pi");pi.alt="";var art=document.querySelector("#term .f1");if(art)pi.src=art.src;b.appendChild(pi);
    b.appendChild(el("h3",null,o.title));
    if(o.value)b.appendChild(el("div","pv",o.value));
    (o.lines||[]).forEach(function(l){b.appendChild(el("div","pm",l))});
    (o.rows||[]).forEach(function(r){var d=el("div","pr");d.appendChild(el("span",null,r[0]));d.appendChild(el("b",null,r[1]));b.appendChild(d)});
    if(o.msg)b.appendChild(el("div","pm",o.msg));
    var bt=el("button",null,o.btn||"확인");bt.type="button";
    bt.addEventListener("click",function(){w.remove();popOn=false;setTimeout(popFlush,250)});
    b.appendChild(bt);w.appendChild(b);document.body.appendChild(w);bt.focus();
  }
  function showOffline(){if(window.__off){var o=window.__off;window.__off=null;offlinePopup(o.g,o.secs)}}

  // 슈퍼장작 버튼 아이콘 (16x16 픽셀: 불꽃 + 쌓인 장작)
  (function(){
    var M=["................",".......o........","......oOo.......","......oOOo..o...",".....oOYOo.oOo..",".....oOYYOoOOo..","....oOYyYOOOYOo.","....oOYyyYOYYOo.","....oOYyyYYYOo..",".....oOOYYOOo...","..KKKKKKKKKKKK..",".KbBKTTKKbBKTTK.",".KTTKBbKKTTKBbK.","KKKKKKKKKKKKKKKK","KbBKTTKbBKTTKbBK","KKKKKKKKKKKKKKKK"];
    var C={K:"#3a2418",B:"#7a4a26",b:"#b5773e",T:"#e0b070",R:"#d23b2e",O:"#f08a24",o:"#ffb347",Y:"#ffd23a",y:"#fff1a0"};
    var cv=document.createElement("canvas");cv.width=16;cv.height=16;var x=cv.getContext("2d");
    M.forEach(function(r,j){for(var i=0;i<16;i++){var c=C[r[i]];if(c){x.fillStyle=c;x.fillRect(i,j,1,1)}}});
    var im=document.getElementById("cpI");if(im)im.src=cv.toDataURL();
  })();
  var sinceSave=0;
  setInterval(function(){
    var before=S.money;settle(Date.now());
    paintTop();if(sheetOpen)paintPanel();
    sinceSave++;if(sinceSave>=50){sinceSave=0;save()}
  },100);
  var hideAt=0,hideTotal=0;
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){hideAt=Date.now();hideTotal=S.total;save()}
    else{
      settle(Date.now());paintTop();if(sheetOpen)paintPanel();
      var away=hideAt?(Date.now()-hideAt)/1000:0,gain=S.total-hideTotal;hideAt=0;
      if(away>=60&&gain>=1)offlinePopup(gain,Math.min(away,offCap()));
    }
  });
  window.addEventListener("pagehide",save);
  var tf=document.querySelectorAll("#term img");
  if($("spA")){$("spA").src=tf[0].src;$("spB").src=tf[1].src}
  var spDone=false;
  function spFinish(){
    if(spDone||!$("splash"))return;spDone=true;
    var sp=$("splash");sp.classList.add("off");setTimeout(function(){sp.remove();showOffline();popFlush()},400);
  }
  if($("splash")){                                     // 매번: 불 꺼짐 → 불 피우는 중 → 불 붙고 김 모락모락 (2초), 터치하면 건너뜀
    setTimeout(function(){if($("spLoad"))$("spLoad").textContent="불 피우는 중…"},700);
    setTimeout(function(){if($("spLoad"))$("spLoad").textContent="고구마 굽는 중!"},1400);
    setTimeout(spFinish,2000);
    $("splash").addEventListener("click",spFinish);
  }
  window.GoguGame={
    state:function(){return S},
    setState:function(o){S=o;lastT=Date.now();renderPanel();paintTop();paintPanel();save();if(window.GoguGame&&window.GoguGame.onItems)window.GoguGame.onItems()},
    setButter:function(t){
      BUTTER=t||0;
      if(awayPend){                                    // 닫아 둔 동안 켜져 있던 슈퍼장작 타임을 7배로 정산 (쿠폰 효과와 겹친 구간은 이미 반영됨)
        var ap=awayPend;awayPend=null;
        if(BUTTER>ap.from){
          var bEndT=Math.min(BUTTER,ap.to),cEnd=Math.min(S.boostEnd||0,bEndT);
          var sec=Math.max(0,bEndT-ap.from)/1000-Math.max(0,cEnd-ap.from)/1000;
          var ex=rawS()*6*Math.max(0,sec);
          if(ex>=1){S.money+=ex;S.total+=ex;if(window.__off)window.__off.g+=ex;else toast("닫아 둔 동안의 슈퍼장작 타임 +"+fmt(ex)+"원");save()}
        }
      }
      paintTop()},
    fresh:fresh,save:save,toast:toast,popup:popup,fmt:fmt,el:el,$:$,
    perks:PERK,
    registerTab:function(id,fn){ext[id]=fn},shopTabs:shopTabs,
    refresh:function(){if(sheetOpen&&(ext[tab]||tab==="free"))renderPanel();paintTop()},
    currentTab:function(){return sheetOpen?tab:null},
    openSheet:openSheet,
    owned:[],
    setArt:function(a,b){
      document.querySelectorAll("#term .f1").forEach(function(i){i.src=a});
      document.querySelectorAll("#term .f2").forEach(function(i){i.src=b});
      var sa=$("spA"),sb=$("spB"),ti=document.querySelector(".total img");
      if(sa)sa.src=a;if(sb)sb.src=b;if(ti)ti.src=a;
    }
  };
  if(window.GoguOnline)window.GoguOnline.start(window.GoguGame);
  paintTop();
})();
</script>
